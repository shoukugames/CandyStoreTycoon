<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Candy Store Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div class="pill pill-shop"><span id="hudShop">Sweet Treats</span></div>
      <div class="pill pill-day"><span class="lbl">Day</span> <b id="hudDay">1</b><span id="hudEvent" class="event-chip"></span></div>
      <div class="pill pill-money" title="Your budget (the register)">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="10" fill="#ffc83d" stroke="#d99a00" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff3b0" stroke-width="1.5"/><text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#b37400" font-family="Fredoka, sans-serif">¥</text></svg>
        <b id="hudMoney">1,000</b>
      </div>
      <div class="pill pill-rep" title="Shop rating — happy kids raise it, unhappy kids lower it"><span id="hudStars"></span></div>
      <div class="pill pill-pantry" title="Backroom pantry storage">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 8l9-4 9 4v10l-9 4-9-4z" fill="#e0a96d" stroke="#9c6630" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 8l9 4 9-4M12 12v10" fill="none" stroke="#9c6630" stroke-width="1.6"/></svg>
        <b id="hudPantry">0/50</b>
      </div>
      <div class="pill pill-clock hidden" id="clockPill">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="10" fill="#fff" stroke="#7a5cff" stroke-width="2.2"/><path d="M12 6v6l4 2" stroke="#7a5cff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
        <b id="hudClock">9:00</b>
        <div class="clockbar"><i id="hudClockBar"></i></div>
      </div>
    </div>

    <!-- Bottom action bar -->
    <div id="bottombar" class="hidden">
      <div class="bb-left">
        <button class="btn btn-mint" data-action="market" id="btnMarket"><span class="bi bi-cart"></span>Market</button>
        <button class="btn btn-purple" data-action="shelves" id="btnShelves"><span class="bi bi-shelf"></span>Stock Shelves</button>
        <button class="btn btn-yellow hidden" data-action="speed" id="btnSpeed">Speed 1x</button>
      </div>
      <div class="bb-tip" id="tip">Tip</div>
      <div class="bb-right">
        <button class="btn btn-pink btn-big" data-action="open" id="btnOpen"><span class="bi bi-door"></span>Open Store</button>
        <button class="btn btn-white btn-icon" data-action="save" title="Save game"><span class="bi bi-save"></span></button>
        <button class="btn btn-white btn-icon" data-action="toggleMusic" id="btnMusic" title="Music on/off"><span class="bi bi-music"></span></button>
        <button class="btn btn-white btn-icon" data-action="menu" title="Menu (Esc)"><span class="bi bi-menu"></span></button>
      </div>
    </div>

    <!-- Restock popup (during rush) -->
    <div id="restockPop" class="hidden"></div>

    <!-- Title screen -->
    <div id="title" class="screen">
      <div class="logo">
        <div class="logo-top" aria-label="Candy Store">
          <span>C</span><span>a</span><span>n</span><span>d</span><span>y</span><span class="sp"></span><span>S</span><span>t</span><span>o</span><span>r</span><span>e</span>
        </div>
        <div class="logo-bottom">TYCOON</div>
      </div>
      <div class="title-menu">
        <button class="btn btn-pink btn-xl" data-action="newGame">New Game</button>
        <button class="btn btn-mint btn-xl" data-action="loadMenu">Load Game</button>
        <button class="btn btn-purple btn-xl" data-action="howto">How to Play</button>
        <button class="btn btn-yellow btn-xl" data-action="settings">Settings</button>
      </div>
      <div class="age-badge"><b>10+</b><span>Recommended for<br>ages 10 and up</span></div>
      <div class="title-foot">Tip: you can save at any time — even in the middle of a rush!</div>
    </div>

    <div id="modalLayer" class="hidden"><div id="modal"></div></div>
    <div id="toasts"></div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
